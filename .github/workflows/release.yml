name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned build tools
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;36.0.0'
          python scripts/fetch-tools.py
      - name: Validate tag and version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -c "import os,sys;sys.path.insert(0,'scripts');from release import version_info;from pathlib import Path;v=Path('VERSION').read_text().strip();version_info(v);assert os.environ['REF_TYPE']!='tag' or os.environ['REF_NAME']=='v'+v"
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.android/debug.keystore
          key: picolibrary-standard-debug-key-v1
      - name: Build and verify with Android debug key
        run: python scripts/release.py --apktool .tools/apktool.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-picolibrary
          path: |
            dist/PicoLibrary*.apk
            dist/PicoLibrary-Magisk-v*.zip
            dist/SHA256SUMS.txt
            dist/verification.json
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name verified-picolibrary --dir artifacts
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          python -c "import json;from pathlib import Path;r=json.loads(Path('verification.json').read_text());assert r['signing']=='android-debug'"
          gh release create "$RELEASE_TAG" --verify-tag --title "Pico Library $RELEASE_TAG" --notes 'Две сборки проверены на хосте. Совместимость системной замены с прошивкой проверяется отдельно.' PicoLibrary-v*.apk PicoLibrary-Magisk-v*.zip SHA256SUMS.txt
