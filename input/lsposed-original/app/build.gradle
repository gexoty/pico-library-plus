plugins {
    id 'com.android.application'
}

android {
    namespace 'com.picoxr.appmanagerfix'
    compileSdk 34

    defaultConfig {
        applicationId 'com.picoxr.appmanagerfix'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('libs/vector-legacy-xposed-api.jar')
    testImplementation 'junit:junit:4.13.2'
}
